training:
  batch_size: 32
  epochs_initial: 8
  epochs_fine_tune: 4
  validation_split: 0.2
  learning_rate_initial: 0.0003
  learning_rate_fine_tune: 0.00003
  warmup_epochs: 1
  weight_decay: 0.0001
  label_smoothing: 0.1
  use_fine_tuning: true

model:
  input_shape: [224, 224, 3]
  dense_units: 512
  dropout_rate: 0.3
  architecture: "mobilenet_v3_large"